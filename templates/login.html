<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access - C37 CoreVault</title>
</head>
<body style="font-family: 'Segoe UI', system-ui, sans-serif; background: #111111; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0; padding: 20px; box-sizing: border-box;">

    <!-- MASTER GATEKEEPER CONTAINER -->
    <div style="background: #1a1a1a; max-width: 400px; width: 100%; padding: 35px 30px; border-radius: 12px; border: 1px solid #C6A15B; box-shadow: 0 4px 20px rgba(198, 161, 91, 0.15); box-sizing: border-box; text-align: center;">
        
        <!-- EMBLEM SHIELD -->
        <div style="color: #C6A15B; font-weight: 900; font-family: 'Segoe UI', sans-serif; font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center; border: 3px solid #C6A15B; border-radius: 50%; width: 55px; height: 55px; box-sizing: border-box; background: #111111; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(198, 161, 91, 0.2);">
            C37
        </div>

        <h1 style="font-size: 1.4rem; font-weight: 850; letter-spacing: -0.5px; color: #ffffff; margin: 0 0 6px 0; line-height: 1.2;">
            CoreVault Admin Terminal
        </h1>
        <p style="font-size: 0.82rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 30px 0;">
            Secured by C37 SmartLabs
        </p>

        <!-- SECURITY INTEGRATION FLASHER SYSTEM -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; margin-bottom: 20px; text-align: left; font-family: sans-serif;">
                        🔒 {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- SECURE CORRIDOR FORM ACCESS -->
        <form action="/admin-login" method="POST" style="display: flex; flex-direction: column; gap: 16px; width: 100%; box-sizing: border-box;">
            <div style="text-align: left; width: 100%;">
                <label style="font-size: 0.75rem; color: #C6A15B; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px;">Enter Security Password</label>
                <input type="password" name="password" placeholder="••••••••••••" required style="width: 100%; padding: 14px 16px; background: #111111; border: 1px solid rgba(198, 161, 91, 0.3); border-radius: 8px; font-size: 1rem; color: #ffffff; box-sizing: border-box; font-family: monospace; outline: none; transition: all 0.2s ease;" onfocus="this.style.borderColor='#C6A15B'; this.style.boxShadow='0 0 0 2px rgba(198, 161, 91, 0.1)';" onblur="this.style.borderColor='rgba(198, 161, 91, 0.3)'; this.style.boxShadow='none';">
            </div>
            
            <button type="submit" style="width: 100%; padding: 14px; background: #C6A15B; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 800; color: #111111; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(198, 161, 91, 0.2);" onmouseover="this.style.background='#ffffff'; this.style.color='#111111';" onmouseout="this.style.background='#C6A15B'; this.style.color='#111111';">
                Unlock Management Tools
            </button>
        </form>

        <!-- RETREAT ACTION CONTROL -->
        <div style="margin-top: 30px; border-top: 1px solid rgba(198, 161, 91, 0.15); padding-top: 18px;">
            <a href="/" style="color: #64748b; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; transition: color 0.2s ease;" onmouseover="this.style.color='#C6A15B'" onmouseout="this.style.color='#64748b'">
                &larr; Back to Public Dashboard
            </a>
        </div>
    </div>

</body>
</html>
